  <text x="495" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0f9ff">Container App Environment</text>
  <text x="495" y="157" text-anchor="middle" font-size="11" fill="#bae6fd">Consumption · internal load balancer</text>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
    <rect x="372" y="170" width="118" height="54" rx="8" fill="#0ea5e9"/>
    <text x="431" y="193">portal-</text><text x="431" y="208">service</text>
    <rect x="500" y="170" width="118" height="54" rx="8" fill="#0ea5e9"/>
    <text x="559" y="193">notification-</text><text x="559" y="208">service</text>
    <rect x="372" y="234" width="118" height="54" rx="8" fill="#0ea5e9"/>
    <text x="431" y="257">external-notif.-</text><text x="431" y="272">service</text>
    <rect x="500" y="234" width="118" height="54" rx="8" fill="#0ea5e9"/>
    <text x="559" y="257">translation-</text><text x="559" y="272">service</text>
  </g>
  <text x="495" y="311" text-anchor="middle" font-size="11" fill="#bae6fd">Quarkus-containers · scale 0..n · Wiz sensor</text>

