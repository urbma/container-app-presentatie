  <rect x="345" y="90" width="300" height="250" rx="10" fill="#111c33" stroke="#22c55e" stroke-width="2"/>
  <text x="357" y="108" font-size="12" font-weight="bold" fill="#86efac">subnet: container-apps (/27)</text>
