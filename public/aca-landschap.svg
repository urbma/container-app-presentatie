<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#f472b6"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#1e293b"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#f8fafc">Azure Container Apps in ons Azure-landschap</text>

  <!-- INTERNET SIDE -->
  <g>
    <circle cx="80" cy="95" r="34" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <path d="M46 95 h68 M80 61 q-22 34 0 68 M80 61 q22 34 0 68" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="150" text-anchor="middle" font-size="14" fill="#cbd5e1">Internet-gebruikers</text>
    <text x="80" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">360fp.azure.bmw.cloud</text>
  </g>
  <g>
    <rect x="190" y="62" width="110" height="66" rx="10" fill="#0369a1" stroke="#7dd3fc" stroke-width="2"/>
