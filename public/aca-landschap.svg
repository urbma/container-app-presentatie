  <rect x="665" y="90" width="265" height="190" rx="10" fill="#111c33" stroke="#f472b6" stroke-width="2"/>
  <text x="677" y="108" font-size="12" font-weight="bold" fill="#f9a8d4">subnet: private-endpoints (/27)</text>
  <g transform="translate(880 92)">
    <path d="M0 0 h42 v22 q0 12 -21 18 q-21 -6 -21 -18z" fill="#f59e0b"/>
    <text x="21" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">NSG</text>
  </g>
  <g font-size="12" fill="#fff">
    <g>
      <rect x="677" y="122" width="22" height="22" rx="11" fill="#f472b6"/><text x="688" y="138" text-anchor="middle" font-weight="bold" fill="#500724">PE</text>
      <path d="M699 133 h14" stroke="#f472b6" stroke-width="2.5"/>
      <rect x="713" y="120" width="205" height="26" rx="6" fill="#475569"/><text x="725" y="138">Service Bus (queues, topic)</text>
    </g>
    <g>
      <rect x="677" y="156" width="22" height="22" rx="11" fill="#f472b6"/><text x="688" y="172" text-anchor="middle" font-weight="bold" fill="#500724">PE</text>
      <path d="M699 167 h14" stroke="#f472b6" stroke-width="2.5"/>
      <rect x="713" y="154" width="205" height="26" rx="6" fill="#475569"/><text x="725" y="172">Storage (config file share)</text>
    </g>
    <g>
      <rect x="677" y="190" width="22" height="22" rx="11" fill="#f472b6"/><text x="688" y="206" text-anchor="middle" font-weight="bold" fill="#500724">PE</text>
      <path d="M699 201 h14" stroke="#f472b6" stroke-width="2.5"/>
      <rect x="713" y="188" width="205" height="26" rx="6" fill="#475569"/><text x="725" y="206">Key Vault (secrets, CMK)</text>
    </g>
    <g>
      <rect x="677" y="224" width="22" height="22" rx="11" fill="#f472b6"/><text x="688" y="240" text-anchor="middle" font-weight="bold" fill="#500724">PE</text>
      <path d="M699 235 h14" stroke="#f472b6" stroke-width="2.5"/>
      <rect x="713" y="222" width="205" height="26" rx="6" fill="#475569"/><text x="725" y="240">Container Registry (shared)</text>
    </g>
  </g>
  <text x="797" y="268" text-anchor="middle" font-size="11" fill="#f9a8d4">PaaS alleen bereikbaar via private IP</text>

  <!-- DB subnet -->
  <rect x="665" y="295" width="128" height="85" rx="10" fill="#111c33" stroke="#a78bfa" stroke-width="2"/>
  <text x="675" y="312" font-size="11" font-weight="bold" fill="#c4b5fd">subnet: db</text>
  <rect x="755" y="299" width="32" height="15" rx="4" fill="#f59e0b"/><text x="771" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c1917">NSG</text>
  <g>
    <ellipse cx="729" cy="332" rx="22" ry="7" fill="#7c3aed"/>
    <path d="M707 332 v26 a22 7 0 0 0 44 0 v-26" fill="#6d28d9"/>
    <ellipse cx="729" cy="332" rx="22" ry="7" fill="#8b5cf6"/>
  </g>
  <text x="729" y="374" text-anchor="middle" font-size="11" fill="#fff">PostgreSQL Flex</text>

  <!-- Web app subnet -->
  <rect x="802" y="295" width="128" height="85" rx="10" fill="#111c33" stroke="#fb923c" stroke-width="2"/>
  <text x="812" y="312" font-size="11" font-weight="bold" fill="#fdba74">subnet: web</text>
  <rect x="892" y="299" width="32" height="15" rx="4" fill="#f59e0b"/><text x="908" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c1917">NSG</text><rect x="824" y="322" width="84" height="40" rx="8" fill="#ea580c"/>
  <text x="866" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Web App</text>
  <text x="866" y="354" text-anchor="middle" font-size="11" fill="#ffedd5">nginx + frontend</text>

  <!-- Route table + DNS + monitoring -->
  <rect x="345" y="352" width="300" height="28" rx="6" fill="#7f1d1d"/>
  <text x="495" y="371" text-anchor="middle" font-size="12" fill="#fecaca">Route table (UDR): al het verkeer via de firewall</text>

  <rect x="345" y="392" width="585" height="38" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="637" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#99f6e4">Private DNS zones</text>
  <text x="637" y="423" text-anchor="middle" font-size="11" fill="#ccfbf1">*.azurecontainerapps.io (wildcard A-record) · database · ACR · privatelink</text>

  <rect x="345" y="440" width="585" height="38" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="637" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#c7d2fe">Observability</text>
  <text x="637" y="471" text-anchor="middle" font-size="11" fill="#e0e7ff">Log Analytics · Application Insights · Grafana / Loki / Tempo / Mimir (zelf gehost als container apps)</text>

  <!-- connections into the VNet -->
  <path d="M300 112 L358 160" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <path d="M312 330 L358 280" fill="none" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="262" y="262" font-size="11" fill="#cbd5e1" text-anchor="middle">VNet peering</text>

  <!-- container apps to PEs / DB -->
  <path d="M630 190 H662" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M630 300 L690 336" stroke="#e2e8f0" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Legend / shared sub -->
  <rect x="30" y="420" width="270" height="56" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="165" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#cbd5e1">Shared subscription</text>
  <text x="165" y="458" text-anchor="middle" font-size="11" fill="#94a3b8">Container Registry · Key Vault · Log Analytics</text>
  <text x="165" y="470" text-anchor="middle" font-size="11" fill="#94a3b8">één set voor test, int en prod</text>

  <text x="480" y="520" text-anchor="middle" font-size="12" fill="#94a3b8">Elke omgeving heeft eigen subnets, NSG's en private endpoints</text>
</svg>

