    <path d="M0 0 h42 v22 q0 12 -21 18 q-21 -6 -21 -18z" fill="#f59e0b"/>
    <text x="21" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">NSG</text>
  </g>
