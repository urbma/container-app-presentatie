    <text x="250" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">Hub</text>
    <rect x="202" y="302" width="96" height="24" rx="5" fill="#7c3aed"/>
    <text x="250" y="319" text-anchor="middle" font-size="12" fill="#fff">VPN / ExpressRoute</text>
    <rect x="202" y="334" width="96" height="24" rx="5" fill="#dc2626"/>
    <text x="250" y="351" text-anchor="middle" font-size="12" fill="#fff">Firewall</text>
    <text x="250" y="378" text-anchor="middle" font-size="11" fill="#cbd5e1">Tufin-regels</text>
  </g>
  <path d="M132 321 H188" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arr)"/>

