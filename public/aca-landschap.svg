    <text x="245" y="106" text-anchor="middle" font-size="12" fill="#e0f2fe">+ WAF</text>
    <text x="245" y="120" text-anchor="middle" font-size="11" fill="#bae6fd">custom domain</text>
  </g>
  <path d="M116 95 H188" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="245" y="144" text-anchor="middle" font-size="11" fill="#f472b6">Private Link</text>

  <!-- INTRANET / HUB SIDE -->
  <g>
    <rect x="30" y="290" width="100" height="62" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="52" y="302" width="56" height="26" rx="3" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <path d="M44 336 h72" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="372" text-anchor="middle" font-size="14" fill="#cbd5e1">Collega's</text>
    <text x="80" y="388" text-anchor="middle" font-size="12" fill="#94a3b8">intranet / VPN</text>
  </g>
  <g>
