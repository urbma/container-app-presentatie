<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" font-family="Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1c1626"/><stop offset="0.38" stop-color="#121a36"/>
<stop offset="0.62" stop-color="#0d2a3c"/><stop offset="1" stop-color="#0d3f4a"/>
</linearGradient>
<radialGradient id="sun" cx="0.88" cy="0.2" r="0.3"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.5"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
<radialGradient id="fire" cx="0.1" cy="0.8" r="0.3"><stop offset="0" stop-color="#ff6a3d" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>

<!-- ============ AKS: paniek ============ -->
