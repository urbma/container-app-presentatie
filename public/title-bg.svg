<ellipse cx="521" cy="792" rx="9" ry="12" stroke-width="5"/>
<line x1="520" y1="814" x2="520" y2="920"/>
<line x1="520" y1="920" x2="475" y2="1000"/><line x1="520" y1="920" x2="575" y2="1000"/>
<line x1="520" y1="840" x2="440" y2="770"/><line x1="520" y1="840" x2="610" y2="780"/>
<!-- moersleutel -->
<line x1="440" y1="770" x2="420" y2="725" stroke-width="9"/>
<circle cx="418" cy="715" r="18" stroke-width="7"/>

</g>

<!-- ============ ACA: relaxen ============ -->
<g opacity="0.4" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">

<line x1="1100" y1="1000" x2="1860" y2="1000" stroke-opacity="0.3"/>

<!-- ligstoel -->
<path d="M1160,935 L1400,975 M1160,935 L1140,870 M1230,950 L1210,1000 M1380,972 L1390,1000" stroke="#6ff0dc" stroke-width="8"/>
<!-- man -->
<circle cx="1215" cy="855" r="42" fill="#0d2a3c"/>
<path d="M1190,846 h56" stroke-width="12"/><path d="M1190,840 h56 v14 h-56 z" fill="#0b1c28" stroke-width="5"/>
