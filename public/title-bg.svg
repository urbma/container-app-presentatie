<path d="M1475,800 a100,80 0 0 1 200,0 z" fill="#6ff0dc" fill-opacity="0.4" stroke="#6ff0dc"/>

<!-- één kleine container-app -->
<g stroke="#6ff0dc" stroke-width="7">
<rect x="1670" y="920" width="150" height="80" rx="10" fill="#6ff0dc" fill-opacity="0.3"/>
<line x1="1670" y1="950" x2="1820" y2="950" stroke-width="5"/>
</g>

</g>

<!-- labels -->
<g font-weight="800" font-size="80" opacity="0.6">
<text x="110" y="610" fill="#ff8a6b">AKS</text>
<text x="1850" y="610" fill="#6ff0dc" text-anchor="end">ACA</text>
