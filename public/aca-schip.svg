  <circle cx="63" cy="293" r="2" fill="#f8fafc"/><circle cx="73" cy="293" r="2" fill="#f8fafc"/>
  <path d="M62 301 q6 5 12 0" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>

  <text x="320" y="36" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Jij levert de container, Azure vaart het schip</text>
  <text x="400" y="336" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="14" fill="#e0f2fe">Geen cluster, geen kapitein, geen machinekamer.</text>
