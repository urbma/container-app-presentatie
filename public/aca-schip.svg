  <rect x="150" y="196" width="80" height="40" rx="3" fill="#f59e0b"/>
  <rect x="236" y="196" width="80" height="40" rx="3" fill="#22c55e"/>
  <rect x="322" y="196" width="80" height="40" rx="3" fill="#a78bfa"/>
  <rect x="193" y="156" width="80" height="40" rx="3" fill="#ef4444"/>
  <rect x="279" y="156" width="80" height="40" rx="3" fill="#38bdf8"/>
  <g stroke="#0f172a" stroke-width="2" opacity="0.35">
    <path d="M166 196 v40 M182 196 v40 M198 196 v40 M214 196 v40 M252 196 v40 M268 196 v40 M284 196 v40 M300 196 v40 M338 196 v40 M354 196 v40 M370 196 v40 M386 196 v40 M209 156 v40 M225 156 v40 M241 156 v40 M257 156 v40 M295 156 v40 M311 156 v40 M327 156 v40 M343 156 v40"/>
  </g>
  <!-- Java container with cup logo -->
  <rect x="279" y="156" width="80" height="40" rx="3" fill="#38bdf8"/>
  <rect x="304" y="162" width="30" height="28" rx="4" fill="#f8fafc"/>
