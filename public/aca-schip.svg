  <rect x="424" y="180" width="46" height="20" rx="3" fill="#0f172a"/>
  <text x="447" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#4ade80">auto</text>
  <rect x="436" y="140" width="10" height="30" fill="#94a3b8"/>
  <path d="M446 142 l22 8 l-22 8z" fill="#22c55e"/>

