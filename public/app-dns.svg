<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" font-family="Segoe UI, sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#fff"/></marker></defs>
<rect width="400" height="260" rx="14" fill="#000" stroke="#334155" stroke-width="2"/>
<rect x="20" y="20" width="360" height="86" rx="10" fill="#0f172a" stroke="#f59e0b"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#f59e0b">Publieke DNS (cloud.bmw)</text>
<text x="32" y="62" font-size="10.5" fill="#cbd5e1" font-family="Consolas, monospace">TXT  asuid.360fp-prod.azure → token</text>
<text x="32" y="82" font-size="10.5" fill="#cbd5e1" font-family="Consolas, monospace">CNAME 360fp-prod.azure → …azurewebsites.net</text>
<text x="32" y="98" font-size="9.5" fill="#94a3b8">alleen om eigenaarschap te bewijzen</text>
<path d="M200 106 V140" stroke="#fff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="210" y="128" font-size="10" fill="#94a3b8">Azure valideert</text>
<rect x="20" y="144" width="170" height="64" rx="10" fill="#0ea5e9"/>
<text x="105" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#000">App Service</text>
<text x="105" y="190" text-anchor="middle" font-size="10" fill="#000">custom domain gebonden</text>
<rect x="210" y="144" width="170" height="64" rx="10" fill="#0f172a" stroke="#22d3ee"/>
<text x="295" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">Private DNS zone</text>
<text x="295" y="186" text-anchor="middle" font-size="10" fill="#cbd5e1">360fp-prod.azure.cloud.bmw</text>
<text x="295" y="200" text-anchor="middle" font-size="9.5" fill="#94a3b8">→ privé-IP van het endpoint</text>
<text x="200" y="240" text-anchor="middle" font-size="12" fill="#94a3b8">Echt verkeer loopt via privé-DNS, niet via de CNAME</text>
