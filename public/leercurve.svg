<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" rx="16" fill="#1e293b"/>
  <!-- mountain / steep curve -->
  <path d="M40 360 L40 340 Q300 335 380 280 Q450 230 470 120 Q480 70 500 40 L600 40 L600 360Z" fill="#334155"/>
  <path d="M40 340 Q300 335 380 280 Q450 230 470 120 Q480 70 500 40" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <!-- labels along the curve -->
  <g font-family="Comic Sans MS, Arial, sans-serif" font-weight="bold" font-size="20">
    <g transform="translate(190 304) rotate(-4)">
      <rect x="-40" y="-22" width="80" height="30" rx="6" fill="#facc15"/>
      <text text-anchor="middle" y="0" fill="#1e293b">YAML</text>
    </g>
    <g transform="translate(312 296) rotate(-15)">
      <rect x="-52" y="-22" width="104" height="30" rx="6" fill="#a78bfa"/>
      <text text-anchor="middle" y="0" fill="#1e293b">Terraform</text>
    </g>
    <g transform="translate(395 235) rotate(-35)">
      <rect x="-38" y="-22" width="76" height="30" rx="6" fill="#38bdf8"/>
      <text text-anchor="middle" y="0" fill="#1e293b">Helm</text>
    </g>
    <g transform="translate(452 140) rotate(-70)">
      <rect x="-36" y="-22" width="72" height="30" rx="6" fill="#f472b6"/>
      <text text-anchor="middle" y="0" fill="#1e293b">RBAC</text>
    </g>
  </g>
  <text x="520" y="30" text-anchor="middle" font-size="16" font-family="Comic Sans MS, Arial, sans-serif" fill="#cbd5e1">Kubernetes expert</text>
  <!-- flag on top -->
  <path d="M545 40 V8 L575 18 L545 28" fill="#22c55e" stroke="#22c55e" stroke-width="3"/>
  <!-- stick figure java dev -->
  <g transform="translate(110 290)" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-30" r="14" fill="#1e293b"/>
    <path d="M0 -16V25M0 -8L-22 -26M0 -8L22 -26M0 25L-14 48M0 25L14 48"/>
    <!-- coffee cup -->
    <g transform="translate(26 -40)" stroke="#f97316">
      <path d="M0 0H18V16Q18 22 9 22Q0 22 0 16Z" fill="#f97316"/>
      <path d="M18 4Q26 4 26 11Q26 16 18 16"/>
    </g>
  </g>
  <!-- speech bubble -->
  <g>
    <rect x="30" y="60" width="270" height="86" rx="14" fill="#f8fafc"/>
    <path d="M90 146 L108 190 L128 146Z" fill="#f8fafc"/>
    <g font-family="Comic Sans MS, Arial, sans-serif" font-weight="bold" fill="#1e293b" text-anchor="middle">
      <text x="165" y="94" font-size="22">Help, ik ben</text>
      <text x="165" y="126" font-size="22">Java developer!</text>
    </g>
  </g>
  <text x="40" y="385" text-anchor="start" font-size="14" font-family="Comic Sans MS, Arial, sans-serif" fill="#94a3b8">"Ik wil features bouwen, geen clusters bouwen."</text>
</svg>
