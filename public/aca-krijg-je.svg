  <path d="M132 258 H156" stroke="#e2e8f0" stroke-width="3"/>
  <!-- revision fork -->
  <path d="M156 258 C180 258 180 232 204 232" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <path d="M156 258 C180 258 180 286 204 286" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6 4"/>
