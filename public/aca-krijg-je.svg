  <circle cx="594" cy="68" r="12" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round"><path d="M594 48 v-4 M594 88 v4 M574 68 h-4 M614 68 h4 M580 54 l-3 -3 M608 82 l3 3 M608 54 l3 -3 M580 82 l-3 3"/></g>
  <g>
    <rect x="486" y="118" width="34" height="20" rx="3" fill="#0ea5e9" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="524" y="118" width="34" height="20" rx="3" fill="#0ea5e9" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="562" y="118" width="34" height="20" rx="3" fill="#0ea5e9" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="505" y="96" width="34" height="20" rx="3" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="543" y="96" width="34" height="20" rx="3" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="524" y="74" width="34" height="20" rx="3" fill="#7dd3fc" stroke="#bae6fd" stroke-width="1.5"/>
  </g>
    <text x="548" y="162" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="12" fill="#bae6fd">drukte? schaalt vanzelf</text>
  <text x="474" y="177" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="13" font-weight="bold" fill="#f8fafc">2. Automatisch schalen, ook naar nul</text>

