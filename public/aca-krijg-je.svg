  <circle cx="579" cy="277" r="1.8" fill="#831843"/><circle cx="585" cy="277" r="1.8" fill="#831843"/>
  <circle cx="563" cy="264" r="3" fill="#831843"/>
  <rect x="535" y="246" width="22" height="4" rx="2" fill="#831843"/>
  <rect x="524" y="296" width="9" height="12" rx="3" fill="#f472b6"/><rect x="556" y="296" width="9" height="12" rx="3" fill="#f472b6"/>
  <path d="M505 272 q-10 -6 -6 -14" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
