  <text x="320" y="353" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="12" fill="#94a3b8">Jij schrijft de Java, Azure doet de rest.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#e2e8f0"/></marker>
  </defs>
