  <text x="244" y="237" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="13" font-weight="bold" fill="#fff">v1 · 80%</text>
  <rect x="204" y="270" width="80" height="32" rx="8" fill="#f59e0b"/>
  <text x="244" y="291" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="13" font-weight="bold" fill="#1c1917">v2 · 20%</text>
  <text x="244" y="314" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="11" fill="#fcd34d">terugdraaien kan altijd</text>
  <text x="166" y="326" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="13" font-weight="bold" fill="#f8fafc">3. Ingress, HTTPS en revisions</text>

  <!-- PANEL 4: pay per use -->
  <rect x="324" y="196" width="300" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
