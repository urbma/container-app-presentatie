    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="#1e293b"/>
  <g font-family="Comic Sans MS, Arial, sans-serif" font-weight="bold" fill="#f8fafc">
