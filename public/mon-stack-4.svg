<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Segoe UI, sans-serif">
<rect width="640" height="360" rx="14" fill="#000" stroke="#334155" stroke-width="2"/>
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Ons alternatief: Grafana-stack in de Container App Environment</text>
<rect x="20" y="52" width="130" height="150" rx="10" fill="#0f172a" stroke="#22d3ee"/>
<text x="85" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">Quarkus-apps</text>
<g font-size="10" fill="#cbd5e1" text-anchor="middle"><text x="85" y="100">portal-service</text><text x="85" y="120">notification-service</text><text x="85" y="140">translation-service</text><text x="85" y="160">external-notif-service</text><text x="85" y="186" fill="#94a3b8">OpenTelemetry + /q/metrics</text></g>
<rect x="190" y="105" width="100" height="44" rx="10" fill="#7c3aed"/>
<text x="240" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Alloy</text>
<text x="240" y="140" text-anchor="middle" font-size="9" fill="#ddd6fe">collector + scrape</text>
<path d="M150 127 H190" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#fff"/></marker></defs>
<g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="340" y="52" width="110" height="44" rx="10" fill="#f59e0b"/><text x="395" y="72">Loki</text><text x="395" y="88" font-size="9" font-weight="400">logs</text>
<rect x="340" y="110" width="110" height="44" rx="10" fill="#22c55e"/><text x="395" y="130">Tempo</text><text x="395" y="146" font-size="9" font-weight="400">traces</text>
<rect x="340" y="168" width="110" height="44" rx="10" fill="#ef4444"/><text x="395" y="188">Mimir</text><text x="395" y="204" font-size="9" font-weight="400">metrics</text></g>
<path d="M290 120 L340 76 M290 127 H340 M290 134 L340 188" stroke="#fff" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="500" y="100" width="120" height="64" rx="12" fill="#f97316"/>
<text x="560" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#000">Grafana</text>
<text x="560" y="146" text-anchor="middle" font-size="10" fill="#000">dashboards + Explore</text>
<path d="M450 74 L500 118 M450 132 H500 M450 190 L500 150" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
