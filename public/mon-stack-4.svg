<text x="395" y="262" text-anchor="middle" font-size="11" fill="#bae6fd">Azure Blob Storage</text>
<path d="M395 212 V240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
<text x="20" y="300" font-size="12" fill="#94a3b8">✔ Eén plek voor logs, traces en metrics</text>
<text x="20" y="320" font-size="12" fill="#94a3b8">✔ LogQL en dashboards (Quarkus) in plaats van KQL</text>
<text x="20" y="340" font-size="12" fill="#94a3b8">✔ 31 dagen retentie, data in onze eigen storage</text>
