<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" rx="16" fill="#1e293b"/>
  <text x="320" y="36" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="21" font-weight="bold" fill="#f8fafc">Serverless... tot je het netwerk tegenkomt</text>

  <!-- Java developer with coffee -->
  <g>
    <!-- coffee mug -->
    <path d="M40 215 h64 v52 q0 22 -22 22 h-20 q-22 0 -22 -22z" fill="#f8fafc"/>
    <path d="M104 228 q26 0 26 20 q0 20 -26 20" fill="none" stroke="#f8fafc" stroke-width="8"/>
    <path d="M52 232 h40" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <text x="72" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ea580c">Java</text>
    <path d="M56 205 q-10 -14 0 -26 q10 -12 0 -24" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M78 205 q-10 -14 0 -26 q10 -12 0 -24" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- face on mug -->
    <circle cx="62" cy="277" r="0"/>
  </g>
  <g stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="190" cy="228" r="22" fill="#1e293b"/>
    <path d="M190 250 L190 300"/>
    <path d="M190 262 L160 280"/>
    <path d="M190 262 L216 244"/>
    <path d="M190 300 L172 332"/>
    <path d="M190 300 L210 332"/>
  </g>
  <!-- stressed face -->
  <g fill="#f8fafc" stroke="none">
    <circle cx="182" cy="224" r="3"/><circle cx="198" cy="224" r="3"/>
  </g>
  <path d="M180 238 q10 -8 20 0" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <path d="M176 214 l12 4 M204 214 l-12 4" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <path d="M168 205 q-5 9 0 11 q5 -2 0 -11z" fill="#38bdf8"/>
  <!-- speech bubble -->
  <g>
    <rect x="130" y="62" width="200" height="62" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <path d="M180 124 l10 20 l10 -20z" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-linejoin="round"/>
    <path d="M181 123 h18" stroke="#0f172a" stroke-width="4"/>
    <g font-family="Consolas, Courier New, monospace" font-size="11" fill="#fca5a5">
      <text x="140" y="83">java.net.UnknownHostException</text>
      <text x="140" y="99" fill="#94a3b8">  at ...ConnectException:</text>
      <text x="140" y="114" fill="#94a3b8">  Connection timed out</text>
    </g>
  </g>

  <!-- tangle of cables -->
  <g fill="none" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M250 300 C290 150 340 330 380 190 S430 280 450 170" stroke="#38bdf8"/>
    <path d="M240 250 C300 330 330 140 390 260 S440 150 470 250" stroke="#f59e0b"/>
    <path d="M260 180 C310 260 350 120 400 230 S440 320 470 200" stroke="#a78bfa"/>
    <path d="M245 330 C300 220 360 340 410 160 S450 300 480 220" stroke="#22c55e"/>
    <path d="M255 210 C320 120 370 300 420 200 S455 140 485 170" stroke="#ef4444"/>
  </g>
  <!-- knots -->
  <g fill="#64748b" stroke="#94a3b8" stroke-width="2">
    <circle cx="330" cy="235" r="7"/><circle cx="390" cy="215" r="7"/><circle cx="430" cy="245" r="7"/>
  </g>
  <!-- signs -->
  <g font-family="Comic Sans MS, Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">
    <g transform="translate(430 66) rotate(-6)"><rect x="-34" y="-12" width="68" height="24" rx="5" fill="#f59e0b"/><text y="5" fill="#1c1917">VNet</text></g>
    <g transform="translate(375 100) rotate(5)"><rect x="-34" y="-12" width="68" height="24" rx="5" fill="#38bdf8"/><text y="5" fill="#082f49">NSG</text></g>
    <g transform="translate(310 295) rotate(-4)"><rect x="-44" y="-12" width="88" height="24" rx="5" fill="#a78bfa"/><text y="5" fill="#2e1065">/23 subnet</text></g>
    <g transform="translate(405 315) rotate(4)"><rect x="-30" y="-12" width="60" height="24" rx="5" fill="#ef4444"/><text y="5" fill="#fff">DNS?</text></g>
    <g transform="translate(445 140) rotate(-5)"><rect x="-26" y="-12" width="52" height="24" rx="5" fill="#22c55e"/><text y="5" fill="#052e16">UDR</text></g>
  </g>

  <!-- container app in the cloud, far away -->
  <g>
    <path d="M510 160 q-30 0 -30 -26 q0 -24 28 -24 q6 -26 38 -26 q34 0 40 28 q28 2 28 24 q0 24 -28 24z" fill="#e2e8f0"/>
    <rect x="522" y="112" width="68" height="46" rx="6" fill="#0ea5e9" stroke="#0369a1" stroke-width="3"/>
    <g stroke="#0369a1" stroke-width="3"><path d="M538 112 v46 M556 112 v46 M574 112 v46"/></g>
    <g fill="#f8fafc"><circle cx="530" cy="106" r="0"/></g>
    <text x="556" y="70" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Container App</text>
  </g>
  <!-- sunglasses chill -->
  <g>
    <rect x="535" y="124" width="14" height="9" rx="3" fill="#0f172a"/>
    <rect x="563" y="124" width="14" height="9" rx="3" fill="#0f172a"/>
    <path d="M549 128 h14" stroke="#0f172a" stroke-width="2"/>
    <path d="M543 146 q13 8 26 0" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g font-family="Comic Sans MS, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="556" y="192">"Ik draai prima...</text>
    <text x="556" y="208">als je me kunt bereiken"</text>
  </g>

  <g transform="translate(556 238) rotate(-3)" font-family="Comic Sans MS, Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle"><rect x="-62" y="-12" width="124" height="24" rx="5" fill="#f472b6"/><text y="5" fill="#500724">Private Endpoint</text></g>

  <text x="320" y="352" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="14" fill="#cbd5e1">Geen cluster beheren? Wel een netwerk-doolhof.</text>
</svg>

